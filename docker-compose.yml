version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amrutam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${DATABASE_NAME:-amrutam_telemedicine}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-amrutam_telemedicine}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amrutam_network

  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amrutam_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  amrutam_network:
    driver: bridge

